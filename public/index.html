<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Secretgram</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Sign-in: there is no sign-up; accounts come from the admin -->
  <div id="auth" class="screen hidden">
    <form id="login-form" class="card">
      <h1>Secretgram</h1>
      <p class="muted">Accounts are created by the administrator.</p>
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error"></p>
    </form>
  </div>

  <div id="app" class="app hidden">
    <aside class="sidebar">
      <header class="sidebar-head">
        <button id="me-btn" class="avatar-btn" title="Edit profile"></button>
        <strong>Secretgram</strong>
        <a id="admin-link" href="/admin" class="hidden">Admin</a>
        <button id="logout-btn" class="ghost">Log out</button>
      </header>
      <input id="search" placeholder="Search by name or @username" autocomplete="off">
      <div id="search-results" class="results hidden"></div>
      <ul id="chat-list" class="chat-list"></ul>
    </aside>

    <main class="main">
      <div id="empty" class="empty">Search for someone to start a chat.</div>
      <div id="chat" class="hidden">
        <header class="chat-head">
          <div id="peer-avatar"></div>
          <div>
            <div id="peer-name" class="name"></div>
            <div id="peer-user" class="muted"></div>
          </div>
        </header>
        <div id="messages" class="messages"></div>
        <form id="composer" class="composer">
          <textarea id="composer-text" rows="1" placeholder="Write a message…"></textarea>
          <button type="submit">Send</button>
        </form>
      </div>
    </main>
  </div>

  <!-- Profile editor -->
  <div id="profile-modal" class="modal hidden">
    <form id="profile-form" class="card">
      <h2>Edit profile</h2>
      <div class="avatar-edit">
        <div id="avatar-preview"></div>
        <div class="stack">
          <label class="file-btn">Change photo
            <input id="avatar-file" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
          </label>
          <button type="button" id="avatar-remove" class="ghost">Remove photo</button>
        </div>
      </div>
      <label>Name <input name="displayName" maxlength="64" required></label>
      <label>Username <input name="username" maxlength="32" pattern="[A-Za-z0-9_]{3,32}" required></label>
      <label>Current password (only if changing it) <input name="currentPassword" type="password" autocomplete="current-password"></label>
      <label>New password <input name="newPassword" type="password" minlength="8" autocomplete="new-password"></label>
      <p id="profile-error" class="error"></p>
      <div class="row-buttons">
        <button type="button" id="profile-cancel" class="ghost">Cancel</button>
        <button type="submit">Save</button>
      </div>
    </form>
  </div>

  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
